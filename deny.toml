# cargo-deny の設定 (要件 R-DIST-4)。CI の `cargo deny check` で、依存のライセンス・既知の脆弱性・取得元・
# 禁じる crate を検査する。書いていないキーは cargo-deny 0.20 の既定値。
# 対象の target は絞らない (どの OS 向けの依存も、配る crate の依存として検査する)。

[advisories]
ignore = []

[licenses]
# 依存が使っているもののうち、MIT OR Apache-2.0 で配る crate と両立するもの (2026-10-19 の Cargo.lock で確かめた)。
# `A OR B` の式は、どれか 1 つがこの一覧にあれば通る。
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  # webpki-roots などが同梱する証明書のデータ。
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[bans]
# 同じ crate の複数の版は、依存の都合で避けられないことがあるので警告にとどめる。
multiple-versions = "warn"
wildcards = "deny"
# 禁じる crate は、決めたらここに書く。
deny = []

[sources]
# crates.io だけから取る。git の依存や別のレジストリを足すときは、ここに明示する。
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
