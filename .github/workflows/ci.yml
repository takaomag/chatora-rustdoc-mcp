# 要件 R-QA-4・R-ARCH-8・R-DIST-4 と doc/m1-plan.md の A1 の CI。
# action はコミットの SHA で固定し、コメントに版を書く (タグは付け替えられるため)。版は出てから 2 週間以上たったものを選ぶ。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # unstable のオプションを使うので nightly の rustfmt で整形を確かめる (rustfmt.toml の冒頭)。
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - run: cargo +nightly fmt --check

  # 配る 3 つの OS で、既定の構成とローカル機能の無い構成 (要件 R-ARCH-8) の両方を検査する。
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # テストがハングしたら、既定の 6 時間ではなくここで止める (各 job の上限も同じ理由)。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml の toolchain を入れる。
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo test --locked --no-default-features

  # rustdoc の警告は Cargo.toml の [lints.rustdoc] では deny にせず、ここで止める。
  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo doc --locked --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  # crates.io に公開できる形か (要件 R-DIST-1。doc/m2-plan.md の A4)。`include` から漏れたファイルや、
  # 公開の形でだけ壊れるビルドを、公開の前に知る。crates.io には上げない (公開は利用者が行う)。
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo publish --dry-run --locked

  # testdata/docs-rs-json.txt の docs.rs の JSON を取ってキャッシュし、実データのテスト (#[ignore]) を回す
  # (doc/m1-plan.md の P3)。一覧が変わらない限り、docs.rs から取り直さない。
  # 3 つの OS で回す (doc/m2-plan.md の A4b)。実データのテストは target を省いた照会に Linux の target を
  # 足し、どの OS でも同じ文書を引く (D7d)。
  testdata:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CHATORA_RUSTDOC_MCP_CACHE__DIR: ${{ github.workspace }}/../rustdoc-json-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CHATORA_RUSTDOC_MCP_CACHE__DIR }}
          # v2: キャッシュの配置 (docs.rs/<名前>/<版>/<target>/<形式>.json と digest。M1 の B6)。
          # 配置を変えたら上げる。
          key: docs-rs-json-v2-${{ runner.os }}-${{ hashFiles('testdata/docs-rs-json.txt') }}
      - name: Fetch the test data
        shell: bash
        run: >-
          awk -F'\t' '!/^#/ && NF >= 2 { print $1 "@" $2 }' testdata/docs-rs-json.txt
          | xargs cargo run --locked --release --example fetch_docs_rs --
      - run: cargo test --locked --release --test testdata -- --ignored
      # std の JSON: dist から取るもの (M1 の B8。毎回、最新の nightly の約 4 MB と、形式 58〜60 の
      # 確認用の 3 日分) と、手元の nightly の rust-docs-json から読むもの。
      - run: rustup toolchain install nightly --profile minimal --component rust-docs-json
      - run: cargo test --locked --release --test std_dist -- --ignored
      # 実データでの動作の検査 (tests/real_data): 決定性 (要件 R-ARCH-5)、引数ごとに値を変えると結果が
      # 変わること、説明文が約束する問いに答えられること (R-QA-5)。応答は outputSchema で検証する。
      # 上の testdata の JSON と std を使い、足りないもの (index、.crate など) はネットワークから取る。
      # docs.rs は 2026-05-01 以降の多くのリリースで Linux の target の JSON しか作らないので、テストの
      # クライアントが target を省いた照会に Linux の target を足し、3 つの OS で同じデータを引く
      # (std を除く。doc/m2-plan.md の D7d)。
      - run: cargo test --locked --release --test real_data -- --ignored

  # toml の整形 (.taplo.toml) と Markdown の lint (.markdownlint.jsonc)。
  config-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: taplo
      - run: taplo fmt --check
      # src/ の Markdown はツールの説明文 (`include_str!` でモデルに渡す文字列) で、文書ではない。
      # probe の README.md も実験の crate の doc に取り込む断片。どちらも見出しで始めない。
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            !target/**
            !src/**
            !poc/m0b/b5-dep-info/probe/README.md

  # 依存のライセンス・既知の脆弱性・取得元・禁じる crate (deny.toml。要件 R-DIST-4)。
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-deny
      - run: cargo deny --locked check
