# 要件 R-QA-4 の canary と、live の docs.rs の smoke test (doc/m1-plan.md の E3)。
# このリポジトリの外で変わるもの (最新の nightly の rustdoc の JSON、docs.rs の配り方、std) を毎日確かめる。
# 失敗したら Issue (label: canary) を開き、通ったら閉じる (失敗を放置しない)。
# GitHub は、公開リポジトリで 60 日間活動が無いと定期実行を止める。止まったら Actions の画面か
# `gh workflow enable canary.yml` で戻す (doc/m1-plan.md の「公開前の見直し」)。
# action はコミットの SHA で固定し、コメントに版を書く (ci.yml と同じ)。

name: Canary

on:
  schedule:
    # 毎日 03:17 UTC (docs.rs と nightly の配布が落ち着いた頃。毎時 0 分の混雑を避ける)。
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 空のキャッシュで docs.rs の今の配り方を見る。
      CHATORA_RUSTDOC_MCP_CACHE__DIR: ${{ github.workspace }}/../canary-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # 最新の nightly の rustdoc の JSON (tests/canary.rs) と、手元の nightly の std (tests/std_dist.rs)。
      - run: rustup toolchain install nightly --profile minimal --component rust-docs-json
      # beta のテストは下の job で (ここには beta が無い)。
      - run: cargo test --locked --release --test canary -- --ignored --skip the_beta
      # dist から取る std (最新の nightly と、形式 58〜60 の確認用の 3 日分)。
      - run: cargo test --locked --release --test std_dist -- --ignored

  # 次の stable になる beta で、プロジェクトの toolchain のままローカルビルドできるか (要件 R-QA-4、
  # m2-plan の F3b)。nightly を入れないので、beta で JSON が出なくても nightly に切り替えて通ることはない。
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHATORA_RUSTDOC_MCP_CACHE__DIR: ${{ github.workspace }}/../canary-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: rustup toolchain install beta --profile minimal
      # 名前が合わなければ 0 件で通ってしまうので、1 件走ったことも確かめる。
      - run: |
          set -euo pipefail
          cargo test --locked --release --test canary -- --ignored --exact \
            the_beta_builds_the_rustdoc_json_of_a_workspace | tee test.log
          grep -q '^test result: ok. 1 passed' test.log

  # 定期実行の結果で Issue を job ごとに開閉する (別の原因の失敗が 1 つの Issue に埋もれないように)。
  # 手で回したときは触らない。
  report:
    needs: [canary, beta]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the canary issue of each job
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANARY: ${{ needs.canary.result }}
          BETA: ${{ needs.beta.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create canary --repo "$REPO" --force \
            --color B60205 --description "The scheduled canary (R-QA-4) failed"
          report() {
            local result=$1 title=$2 body=$3 open
            open=$(TITLE="$title" gh issue list --repo "$REPO" --state open --label canary \
              --json number,title --jq '[.[] | select(.title == env.TITLE)][0].number // empty') \
              || return 1
            if [ "$result" = success ]; then
              if [ -n "$open" ]; then
                gh issue close "$open" --repo "$REPO" --comment "The job passed again: $RUN_URL"
              fi
            elif [ -n "$open" ]; then
              gh issue comment "$open" --repo "$REPO" --body "Still failing ($result): $RUN_URL"
            else
              gh issue create --repo "$REPO" --label canary --title "$title" \
                --body "The scheduled canary ($result) failed: $RUN_URL

          $body See the failed step for what changed. This issue closes itself when the job passes again."
            fi
          }
          # Both, even when the first cannot be told.
          status=0
          report "$CANARY" "Canary failed: nightly rustdoc, docs.rs or std changed" \
            "It checks what changes outside this repository (requirement R-QA-4): the rustdoc JSON of the latest nightly, what docs.rs serves, and the std of the distribution server." \
            || status=1
          report "$BETA" "Canary failed: the beta builds otherwise" \
            "It checks that the beta, the next stable, builds the rustdoc JSON of a workspace with RUSTC_BOOTSTRAP for its crates alone (requirement R-QA-4)." \
            || status=1
          exit "$status"
